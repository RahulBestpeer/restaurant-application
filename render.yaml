databases:
  - name: restaurant-api-db
    databaseName: restaurant_api_production
    user: restaurant_api
    plan: free

services:
  - type: web
    name: restaurant-api
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-api-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false          # set this manually in the Render dashboard
      - key: RAILS_ENV
        value: production
      - key: APP_HOST
        sync: false          # set to your render app URL, e.g. restaurant-api.onrender.com
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "0"           # 0 = single-process mode (safe for free plan); raise to 2 on paid plans
