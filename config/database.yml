default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "/var/run/postgresql") %>
  port: <%= ENV.fetch("DB_PORT", "5433") %>
  username: <%= ENV.fetch("DB_USERNAME", "developer") %>

development:
  <<: *default
  database: restaurant_new_api_development

test:
  <<: *default
  database: restaurant_new_api_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "restaurant_api_production") %>
  password: <%= ENV["DB_PASSWORD"] %>
